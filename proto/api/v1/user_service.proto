syntax = "proto3";

package memos.api.v1;

import "api/v1/common.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/httpbody.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/type/color.proto";

option go_package = "gen/api/v1";

service UserService {
  // ListUsers returns a list of users.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/api/v1/users"};
  }

  // BatchGetUsers returns active users by usernames.
  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse) {
    option (google.api.http) = {
      post: "/api/v1/users:batchGet"
      body: "*"
    };
  }

  // GetUser gets a user by username.
  // Format: users/{user} (e.g., users/steven)
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {get: "/api/v1/{name=users/*}"};
    option (google.api.method_signature) = "name";
  }

  // CreateUser creates a new user.
  rpc CreateUser(CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/api/v1/users"
      body: "user"
    };
    option (google.api.method_signature) = "user,user_id";
  }

  // UpdateUser updates a user.
  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      patch: "/api/v1/{user.name=users/*}"
      body: "user"
    };
    option (google.api.method_signature) = "user,update_mask";
  }

  // DeleteUser deletes a user.
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=users/*}"};
    option (google.api.method_signature) = "name";
  }

  // ListAllUserStats returns statistics for all users.
  rpc ListAllUserStats(ListAllUserStatsRequest) returns (ListAllUserStatsResponse) {
    option (google.api.http) = {get: "/api/v1/users:stats"};
  }

  // GetUserStats returns statistics for a specific user.
  rpc GetUserStats(GetUserStatsRequest) returns (UserStats) {
    option (google.api.http) = {get: "/api/v1/{name=users/*}:getStats"};
    option (google.api.method_signature) = "name";
  }

  // ExportMemos writes every memo the user created, with comments, archived
  // memos, and attachment files, as a Memos export file (a ZIP file, see
  // docs/design/memos-export-format.md). Only the user may export their own
  // memos. The body is the archive; content_type is its media type.
  rpc ExportMemos(ExportMemosRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/{name=users/*}:exportMemos"};
    option (google.api.method_signature) = "name";
  }

  // ImportMemos uploads a Memos export file in bounded chunks and imports it into
  // the user's memos. The first call carries the spec and returns an
  // upload_id; later calls carry that upload_id. A finishing call with
  // validate_only returns the plan and keeps the archive staged; a finishing
  // call without it imports and returns the report. Uploads are bound to the
  // authenticated user, expire after 30 minutes of inactivity, and do not
  // survive a server restart.
  rpc ImportMemos(ImportMemosRequest) returns (ImportMemosResponse) {
    option (google.api.http) = {
      post: "/api/v1/{name=users/*}:importMemos"
      body: "*"
    };
  }

  // GetUserSetting returns the user setting.
  rpc GetUserSetting(GetUserSettingRequest) returns (UserSetting) {
    option (google.api.http) = {get: "/api/v1/{name=users/*/settings/*}"};
    option (google.api.method_signature) = "name";
  }

  // UpdateUserSetting updates the user setting.
  rpc UpdateUserSetting(UpdateUserSettingRequest) returns (UserSetting) {
    option (google.api.http) = {
      patch: "/api/v1/{setting.name=users/*/settings/*}"
      body: "setting"
    };
    option (google.api.method_signature) = "setting,update_mask";
  }

  // ListUserSettings returns a list of user settings.
  rpc ListUserSettings(ListUserSettingsRequest) returns (ListUserSettingsResponse) {
    option (google.api.http) = {get: "/api/v1/{parent=users/*}/settings"};
    option (google.api.method_signature) = "parent";
  }

  // ListPersonalAccessTokens returns a list of Personal Access Tokens (PATs) for a user.
  // PATs are long-lived tokens for API/script access, distinct from short-lived JWT access tokens.
  rpc ListPersonalAccessTokens(ListPersonalAccessTokensRequest) returns (ListPersonalAccessTokensResponse) {
    option (google.api.http) = {get: "/api/v1/{parent=users/*}/personalAccessTokens"};
    option (google.api.method_signature) = "parent";
  }

  // CreatePersonalAccessToken creates a new Personal Access Token for a user.
  // The token value is only returned once upon creation.
  rpc CreatePersonalAccessToken(CreatePersonalAccessTokenRequest) returns (CreatePersonalAccessTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/{parent=users/*}/personalAccessTokens"
      body: "*"
    };
  }

  // DeletePersonalAccessToken deletes a Personal Access Token.
  rpc DeletePersonalAccessToken(DeletePersonalAccessTokenRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=users/*/personalAccessTokens/*}"};
    option (google.api.method_signature) = "name";
  }
}

message User {
  option (google.api.resource) = {
    type: "memos.api.v1/User"
    pattern: "users/{user}"
    name_field: "name"
    singular: "user"
    plural: "users"
  };

  // The resource name of the user.
  // Format: users/{user}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The role of the user.
  Role role = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The unique username for login.
  string username = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. The email address of the user. Stored trimmed and lowercased;
  // empty means no address. An address belongs to at most one user on the
  // instance, so writes that would reuse one fail with ALREADY_EXISTS.
  string email = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The display name of the user.
  string display_name = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The avatar URL of the user.
  string avatar_url = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The description of the user.
  string description = 7 [(google.api.field_behavior) = OPTIONAL];

  // Input only. The password for the user.
  string password = 8 [(google.api.field_behavior) = INPUT_ONLY];

  // The state of the user.
  State state = 9 [(google.api.field_behavior) = REQUIRED];

  // Output only. The creation timestamp.
  google.protobuf.Timestamp create_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The last update timestamp.
  google.protobuf.Timestamp update_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // User role enumeration.
  enum Role {
    ROLE_UNSPECIFIED = 0;
    // Admin role with system access.
    ADMIN = 2;
    // User role with limited access.
    USER = 3;
  }
}

message ListUsersRequest {
  // Optional. The maximum number of users to return.
  // The service may return fewer than this value.
  // If unspecified, at most 50 users will be returned.
  // The maximum value is 1000; values above 1000 will be coerced to 1000.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListUsers` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Filter to apply to the list results.
  // Example: "username == 'steven'"
  // Supported operators: ==
  // Supported fields: username
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If true, show deleted users in the response.
  bool show_deleted = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ListUsersResponse {
  // The list of users.
  repeated User users = 1;

  // A token that can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

message BatchGetUsersRequest {
  repeated string usernames = 1;
}

message BatchGetUsersResponse {
  repeated User users = 1;
}

message GetUserRequest {
  // Required. The resource name of the user.
  // Format: users/{user}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/User"}
  ];

  // Optional. The fields to return in the response.
  // If not specified, all fields are returned.
  google.protobuf.FieldMask read_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message CreateUserRequest {
  // Required. The user to create.
  User user = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY
  ];

  // Optional. The resource ID to use for this user. If set, it must equal
  // user.username and follow the username format.
  // Format: ^[a-zA-Z0-9]([a-zA-Z0-9-]{0,34}[a-zA-Z0-9])?$
  string user_id = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If set, validate the request but don't actually create the user.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. An idempotency token that can be used to ensure that multiple
  // requests to create a user have the same result.
  string request_id = 4 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateUserRequest {
  // Required. The user to update.
  User user = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. If set to true, allows updating sensitive fields.
  bool allow_missing = 3 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteUserRequest {
  // Required. The resource name of the user to delete.
  // Format: users/{user}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/User"}
  ];

  // Optional. If set to true, the user will be deleted even if they have associated data.
  bool force = 2 [(google.api.field_behavior) = OPTIONAL];
}

// User statistics messages
message UserStats {
  option (google.api.resource) = {
    type: "memos.api.v1/UserStats"
    pattern: "users/{user}/stats"
    singular: "userStats"
    plural: "userStats"
  };

  // The resource name of the user statistics singleton.
  // Format: users/{user}/stats
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  reserved 2;
  reserved "memo_display_timestamps";

  // The stats of memo types.
  MemoTypeStats memo_type_stats = 3;

  // The count of tags.
  map<string, int32> tag_count = 4;

  // The creation timestamps of the user's memos.
  repeated google.protobuf.Timestamp memo_created_timestamps = 7;

  // The latest update timestamps of the user's memos (one per memo,
  // mirrors memo_created_timestamps). Used by the activity heatmap when
  // the client's view is set to update_time basis.
  repeated google.protobuf.Timestamp memo_updated_timestamps = 8;

  // The pinned memos of the user.
  repeated string pinned_memos = 5 [(google.api.resource_reference) = {type: "memos.api.v1/Memo"}];

  // Total memo count.
  int32 total_memo_count = 6;

  // Total persisted attachment size in bytes, including unlinked uploads and
  // attachments in all spaces. Excludes temporary uploads and derived files.
  // Returned only by GetUserStats for the authenticated user's own stats,
  // independently of the request's memo filter.
  optional int64 attachment_storage_bytes = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Memo type statistics.
  message MemoTypeStats {
    int32 link_count = 1;
    int32 code_count = 2;
    int32 todo_count = 3;
    int32 undo_count = 4;
  }
}

message ExportMemosRequest {
  // Required. The user whose memos are exported. Must be the caller.
  // Format: users/{user}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/User"}
  ];
}

message ImportMemosRequest {
  // What the importer does with a memo whose UID the user already holds.
  enum ConflictPolicy {
    CONFLICT_POLICY_UNSPECIFIED = 0;
    // Leave the existing memo untouched. This is the default.
    SKIP = 1;
    // Update the existing memo's content and metadata from the archive.
    REPLACE = 2;
    // Keep the existing memo and create the archive version under a fresh UID.
    DUPLICATE = 3;
  }

  // Required. The user who receives the memos. Must be the caller.
  // Format: users/{user}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/User"}
  ];

  // Required. Start a new upload or continue an existing one.
  oneof upload {
    // Starts a new upload. The same call may also carry data and finish_write.
    ImportMemosSpec spec = 2;

    // Continues the upload identified by a previous response.
    string upload_id = 3;
  }

  // Required. Zero-based byte offset at which data is written. Must equal the
  // committed size, except when retrying the most recently accepted chunk
  // with identical bytes and offset, which is accepted without writing again.
  int64 write_offset = 4 [(google.api.field_behavior) = REQUIRED];

  // Optional. Archive bytes, at most max_chunk_size long. With no data and
  // finish_write false, the call reports progress without writing, and
  // write_offset is ignored.
  bytes data = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Finish the upload after writing data. The committed size must
  // then equal total_size. The archive is validated and, unless
  // validate_only is set, imported. Any later call for an imported upload
  // returns the same report.
  bool finish_write = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. On a finishing call, validate the archive and return the plan
  // without importing. The upload stays staged so a later finishing call can
  // import it.
  bool validate_only = 7 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Read on the finishing call that imports. Unspecified means SKIP.
  ConflictPolicy conflict_policy = 8 [(google.api.field_behavior) = OPTIONAL];
}

message ImportMemosSpec {
  // Optional. Total size of the archive in bytes.
  int64 total_size = 1 [(google.api.field_behavior) = OPTIONAL];
}

message ImportMemosResponse {
  // Opaque ID for subsequent calls. This is not a resource name.
  string upload_id = 1;

  // Number of archive bytes committed so far.
  int64 committed_size = 2;

  // Maximum number of data bytes accepted in one call.
  int32 max_chunk_size = 3;

  // Set once the upload has been finished.
  oneof result {
    // What the import would do. Set by a finishing call with validate_only.
    MemoImportPlan plan = 4;

    // What the import did. Set by a finishing call that imported.
    MemoImportReport report = 5;
  }
}

// MemoImportIssue is one warning or failure of an import, tied to the memo
// UID from the archive when there is one.
message MemoImportIssue {
  // The archive memo UID the issue concerns, if any.
  string memo = 1;

  string message = 2;
}

// MemoImportPlan describes what importing a staged archive would do.
message MemoImportPlan {
  // When the archive was written.
  google.protobuf.Timestamp export_time = 1;

  // Username of the user who exported the archive.
  string exporter = 2;

  // The software that wrote the archive.
  string generator = 3;

  // Number of memo records in the archive.
  int32 memos = 4;

  // Number of attachment files in the archive.
  int32 attachments = 5;

  // Memos whose UID nobody on the instance holds.
  int32 new = 6;

  // Memos the user already holds; the conflict policy applies to them.
  int32 existing = 7;

  // Memos whose UID another account holds; they are imported under fresh UIDs.
  int32 renamed = 8;

  // Deviations the archive reader corrected while validating.
  repeated MemoImportIssue warnings = 9;
}

// MemoImportReport is the outcome of an import.
message MemoImportReport {
  int32 created = 1;

  int32 updated = 2;

  int32 skipped = 3;

  int32 failed = 4;

  repeated MemoImportIssue warnings = 5;

  // One entry per failed memo, with the reason.
  repeated MemoImportIssue failures = 6;
}

message GetUserStatsRequest {
  // Required. The resource name of the user.
  // Format: users/{user}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/User"}
  ];

  // Optional. CEL expression selecting the readable non-comment memos to
  // include. Supports the same fields as ListMemos, including `space`.
  string filter = 2 [(google.api.field_behavior) = OPTIONAL];

  reserved 3;
  reserved "space", "unassigned";
}

message ListAllUserStatsRequest {
  // Optional. The state of memos to include. Defaults to NORMAL.
  State state = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Filter to apply to memo stats.
  // Uses the same filter syntax as ListMemos.
  string filter = 2 [(google.api.field_behavior) = OPTIONAL];

  reserved 3, 4;
  reserved "space", "unassigned";
}

message ListAllUserStatsResponse {
  // The list of user statistics.
  repeated UserStats stats = 1;
}

// User settings message
message UserSetting {
  option (google.api.resource) = {
    type: "memos.api.v1/UserSetting"
    pattern: "users/{user}/settings/{setting}"
    singular: "userSetting"
    plural: "userSettings"
  };

  // The name of the user setting.
  // Format: users/{user}/settings/{setting}, {setting} is the key for the setting.
  // For example, "users/steven/settings/GENERAL" for general settings.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  oneof value {
    GeneralSetting general_setting = 2;
    TagsSetting tags_setting = 6;
  }

  // Enumeration of user setting keys.
  enum Key {
    KEY_UNSPECIFIED = 0;
    // GENERAL is the key for general user settings.
    GENERAL = 1;
    reserved 4;
    reserved "WEBHOOKS";
    // TAGS is the key for per-user tag metadata.
    TAGS = 5;
  }

  // General user settings configuration.
  message GeneralSetting {
    // The preferred locale of the user.
    string locale = 1 [(google.api.field_behavior) = OPTIONAL];
    // The default visibility of the memo.
    string memo_visibility = 3 [(google.api.field_behavior) = OPTIONAL];
    // The preferred theme of the user.
    // This references a CSS file in the web/public/themes/ directory.
    // If not set, the default theme will be used.
    string theme = 4 [(google.api.field_behavior) = OPTIONAL];
    // Whether the official client should save metadata from future media uploads.
    bool save_media_metadata = 5 [(google.api.field_behavior) = OPTIONAL];
    // semantic_index_state is the user's semantic-search index lifecycle.
    // Clients may set OFF or INITIALIZING. READY is set by the server when
    // the first backfill finishes.
    SemanticIndexState semantic_index_state = 6 [(google.api.field_behavior) = OPTIONAL];
    // semantic_score_threshold is the minimum cosine similarity for fuzzy search.
    // Unset uses 0.5. Valid range is 0 to 1. Higher values are stricter.
    optional float semantic_score_threshold = 7 [(google.api.field_behavior) = OPTIONAL];
  }

  // SemanticIndexState is the lifecycle of one user's memo embedding index.
  enum SemanticIndexState {
    SEMANTIC_INDEX_STATE_UNSPECIFIED = 0;
    SEMANTIC_INDEX_STATE_OFF = 1;
    SEMANTIC_INDEX_STATE_INITIALIZING = 2;
    SEMANTIC_INDEX_STATE_READY = 3;
  }

  // Tag metadata for user-specific display rules.
  message TagMetadata {
    // Optional background color for the tag label.
    // When unset, the default tag color is used.
    google.type.Color background_color = 1 [(google.api.field_behavior) = OPTIONAL];
    // Whether memos with this tag should have their content blurred.
    bool blur_content = 2 [(google.api.field_behavior) = OPTIONAL];
  }

  // User-specific tag metadata.
  message TagsSetting {
    // Map of tag name pattern to tag metadata.
    // Each key is treated as an anchored regular expression (^pattern$).
    map<string, TagMetadata> tags = 1 [(google.api.field_behavior) = OPTIONAL];
  }
}

message GetUserSettingRequest {
  // Required. The resource name of the user setting.
  // Format: users/{user}/settings/{setting}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/UserSetting"}
  ];
}

message UpdateUserSettingRequest {
  // Required. The user setting to update.
  UserSetting setting = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request message for ListUserSettings method.
message ListUserSettingsRequest {
  // Required. The parent resource whose settings will be listed.
  // Format: users/{user}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/User"}
  ];

  // Optional. The maximum number of settings to return.
  // The service may return fewer than this value.
  // If unspecified, at most 50 settings will be returned.
  // The maximum value is 1000; values above 1000 will be coerced to 1000.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListUserSettings` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ListUserSettings method.
message ListUserSettingsResponse {
  // The list of user settings.
  repeated UserSetting settings = 1;

  // A token that can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

message PersonalAccessToken {
  option (google.api.resource) = {
    type: "memos.api.v1/PersonalAccessToken"
    pattern: "users/{user}/personalAccessTokens/{personal_access_token}"
    singular: "personalAccessToken"
    plural: "personalAccessTokens"
  };

  // The resource name of the personal access token.
  // Format: users/{user}/personalAccessTokens/{personal_access_token}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The description of the token.
  string description = 2 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The creation timestamp.
  google.protobuf.Timestamp created_at = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The expiration timestamp.
  google.protobuf.Timestamp expires_at = 4 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The last used timestamp.
  google.protobuf.Timestamp last_used_at = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListPersonalAccessTokensRequest {
  // Required. The parent resource whose personal access tokens will be listed.
  // Format: users/{user}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/User"}
  ];

  // Optional. The maximum number of tokens to return.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token for pagination.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListPersonalAccessTokensResponse {
  // The list of personal access tokens.
  repeated PersonalAccessToken personal_access_tokens = 1;

  // A token for the next page of results.
  string next_page_token = 2;
}

message CreatePersonalAccessTokenRequest {
  // Required. The parent resource where this token will be created.
  // Format: users/{user}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/User"}
  ];

  // Optional. Description of the personal access token.
  string description = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Expiration duration in days (0 = never expires).
  int32 expires_in_days = 3 [(google.api.field_behavior) = OPTIONAL];
}

message CreatePersonalAccessTokenResponse {
  // The personal access token metadata.
  PersonalAccessToken personal_access_token = 1;

  // The actual token value - only returned on creation.
  // This is the only time the token value will be visible.
  string token = 2;
}

message DeletePersonalAccessTokenRequest {
  // Required. The resource name of the personal access token to delete.
  // Format: users/{user}/personalAccessTokens/{personal_access_token}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/PersonalAccessToken"}
  ];
}
