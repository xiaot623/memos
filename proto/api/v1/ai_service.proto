syntax = "proto3";

package memos.api.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "gen/api/v1";

service AIService {
  // ListEmbeddingModels returns embedding models advertised by one configured provider.
  rpc ListEmbeddingModels(ListEmbeddingModelsRequest) returns (ListEmbeddingModelsResponse) {
    option (google.api.http) = {get: "/api/v1/ai/embeddingModels"};
  }
}

message ListEmbeddingModelsRequest {
  // Required. The id of a configured AI provider.
  string provider_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListEmbeddingModelsResponse {
  repeated EmbeddingModel models = 1;
}

message EmbeddingModel {
  // id is the provider model identifier sent with embedding requests.
  string id = 1;
  // title is a display name. It may match id when the provider has no separate title.
  string title = 2;
}
